version: '3.9'

services:
  backend:
    build: ./backend
    container_name: studycompanion-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/studycompanion.db
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: studycompanion-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  data:
  chroma_db:
